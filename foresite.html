<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1526">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Foresite</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<script>
  try{ if(localStorage.getItem('foresite-theme')==='light'){ document.documentElement.setAttribute('data-theme','light'); } }catch(e){}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:dark;
    --navy-deep:#0B1526;
    --navy:#12203A;
    --navy-panel:#16294A;
    --navy-panel-2:#1B3054;
    --grid-line:#2A4470;
    --grid-line-soft:#22385E;
    --chalk:#EAF0FA;
    --chalk-dim:#AEC0DD;
    --chalk-faint:#7590B8;
    --orange:#FF6A3D;
    --orange-dim:#5A3324;
    --amber:#FFB454;
    --amber-dim:#4E3B1E;
    --blue:#6FA8DC;
    --blue-dim:#233A54;
    --green:#4ADE80;
    --green-dim:#1E3A2C;
    --red:#FF5470;
    --bat-low-bg:#223033;
    --bat-dismiss-bg:#2a2a30; --bat-dismiss-fg:#8a8a95;
    --topbar-bg:rgba(11,21,38,0.6);
    --legal-disclaimer-bg:#3A1512;
  }
  html[data-theme="light"]{
    color-scheme:light;
    --navy-deep:#E9EDF4;
    --navy:#FFFFFF;
    --navy-panel:#F4F7FB;
    --navy-panel-2:#E8EDF5;
    --grid-line:#C9D3E1;
    --grid-line-soft:#DCE3ED;
    --chalk:#16213A;
    --chalk-dim:#46536B;
    --chalk-faint:#72819A;
    --orange:#D9480F;
    --orange-dim:#FDE4D8;
    --amber:#A8640E;
    --amber-dim:#FBEED6;
    --blue:#1D6FC9;
    --blue-dim:#DCEAF8;
    --green:#198A51;
    --green-dim:#D9F2E4;
    --red:#D6334C;
    --bat-low-bg:#E3E9F1;
    --bat-dismiss-bg:#E5E8ED; --bat-dismiss-fg:#6B7890;
    --topbar-bg:rgba(233,237,244,0.7);
    --legal-disclaimer-bg:#FBE9E3;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--navy-deep);color:var(--chalk);font-family:'Inter',sans-serif;height:100%;overflow:hidden;}
  body{
    background-image:
      linear-gradient(var(--grid-line-soft) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line-soft) 1px, transparent 1px);
    background-size: 28px 28px;
    height:100vh;
  }
  #app{height:100vh;overflow:hidden;}
  html[dir="rtl"] .sidebar{border-right:none;border-left:1px solid var(--grid-line);}
  html[dir="rtl"] .nav-item{text-align:right;}
  html[dir="rtl"] .alert-card{border-left:1px solid var(--grid-line);border-right:3px solid var(--grid-line);}
  html[dir="rtl"] .alert-card.critical{border-right-color:var(--orange);}
  html[dir="rtl"] .alert-card.high{border-right-color:var(--amber);}
  html[dir="rtl"] .alert-card.medium{border-right-color:var(--blue);}
  html[dir="rtl"] .alert-card.low{border-right-color:var(--chalk-faint);}
  h1,h2,h3,h4{font-family:'Barlow Condensed',sans-serif;font-weight:600;margin:0;letter-spacing:0.01em;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  a{color:inherit;}
  button{font-family:'Inter',sans-serif;cursor:pointer;}
  ::selection{background:var(--orange);color:var(--navy-deep);}

  /* ---- Shell ---- */
  .shell{display:flex;height:100vh;overflow:hidden;}
  .sidebar{
    width:200px;flex-shrink:0;background:var(--navy);border-right:1px solid var(--grid-line);
    display:flex;flex-direction:column;padding:14px 0;height:100vh;overflow:hidden;
  }
  .brand{padding:0 18px 12px 18px;border-bottom:1px solid var(--grid-line);margin-bottom:6px;}
  .brand-mark{display:flex;align-items:baseline;gap:6px;}
  .brand-mark .tick{width:9px;height:16px;background:var(--orange);display:inline-block;flex-shrink:0;}
  .brand h1{font-size:19px;line-height:1.05;color:var(--chalk);}
  .brand p{margin:3px 0 0 0;font-size:10px;color:var(--chalk-faint);font-family:'IBM Plex Mono',monospace;letter-spacing:0.03em;}
  .nav{display:flex;flex-direction:column;padding:6px 8px;gap:1px;flex-shrink:0;}
  .nav-item{
    display:flex;align-items:center;gap:9px;padding:7px 11px;border-radius:2px;color:var(--chalk-dim);
    font-size:13px;font-weight:500;border:1px solid transparent;background:none;text-align:left;width:100%;
  }
  .nav-item .num{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--chalk-faint);width:14px;}
  .nav-item:hover{background:var(--navy-panel);color:var(--chalk);}
  .nav-item.active{background:var(--navy-panel-2);color:var(--chalk);border-color:var(--grid-line);}
  .nav-item.active .num{color:var(--orange);}
  .sidebar-foot{padding:10px 18px 0 18px;border-top:1px solid var(--grid-line);margin-top:auto;flex-shrink:0;}
  .sidebar-foot .co{font-size:12px;color:var(--chalk);font-weight:600;}
  .sidebar-foot .meta{font-size:10px;color:var(--chalk-faint);font-family:'IBM Plex Mono',monospace;margin-top:2px;}
  .lang-select{margin-top:8px;}
  .lang-select select{font-size:11px;padding:5px 7px;}

  .main{flex:1;min-width:0;display:flex;flex-direction:column;height:100vh;overflow:hidden;}
  .topbar{
    display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 22px;flex-shrink:0;
    border-bottom:1px solid var(--grid-line);background:var(--topbar-bg);backdrop-filter:blur(6px);
  }
  .topbar h2{font-size:19px;color:var(--chalk);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .topbar-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .topbar-right select, .topbar-right input{width:auto;}
  .lang-select select{font-size:12px;padding:6px 8px;}
  .topbar-right .lang-select{margin-top:0;}
  .theme-toggle{
    width:34px;height:34px;border-radius:50%;border:1px solid var(--grid-line);background:var(--navy-panel);
    color:var(--chalk-dim);display:flex;align-items:center;justify-content:center;font-size:15px;line-height:1;
  }
  .theme-toggle:hover{border-color:var(--chalk-faint);color:var(--chalk);}
  .content{padding:14px 22px 16px 22px;max-width:1180px;min-width:0;flex:1;overflow:hidden;min-height:0;display:flex;flex-direction:column;}
  .content > *{min-width:0;}

  select, input[type=text], input[type=number], input[type=date], textarea{
    background:var(--navy-panel);border:1px solid var(--grid-line);color:var(--chalk);
    padding:9px 11px;font-size:14px;font-family:'Inter',sans-serif;border-radius:2px;width:100%;
  }
  textarea{resize:vertical;min-height:90px;font-size:14px;line-height:1.5;}
  select:focus,input:focus,textarea:focus{outline:1px solid var(--orange);outline-offset:0;}
  label{font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--chalk-faint);display:block;margin-bottom:5px;font-family:'IBM Plex Mono',monospace;}
  .field{margin-bottom:14px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}

  .btn{
    padding:10px 18px;border-radius:2px;border:1px solid var(--grid-line);background:var(--navy-panel);
    color:var(--chalk);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:8px;
  }
  .btn:hover{background:var(--navy-panel-2);}
  .btn-primary{background:var(--orange);border-color:var(--orange);color:#1A0D06;}
  .btn-primary:hover{background:#ff7d54;}
  .btn-primary:disabled{opacity:0.5;cursor:default;}
  .btn-ghost{background:none;border-color:var(--grid-line);}
  .btn-sm{padding:6px 12px;font-size:12px;}

  .panel{
    background:var(--navy-panel);border:1px solid var(--grid-line);border-radius:2px;padding:14px 16px;margin-bottom:14px;
  }
  .panel-title{font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:var(--chalk-faint);font-family:'IBM Plex Mono',monospace;margin-bottom:10px;}

  .stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--grid-line);border:1px solid var(--grid-line);margin-bottom:14px;}
  .stat{background:var(--navy-panel);padding:11px 14px;}
  .stat .v{font-family:'IBM Plex Mono',monospace;font-size:21px;color:var(--chalk);font-weight:600;}
  .stat .l{font-size:10px;color:var(--chalk-faint);text-transform:uppercase;letter-spacing:0.05em;margin-top:2px;}
  .stat.crit .v{color:var(--orange);}
  .stat.good .v{color:var(--green);}

  .badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:2px;font-size:11px;font-weight:600;font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:0.03em;}
  .badge-critical{background:var(--orange-dim);color:var(--orange);}
  .badge-high{background:var(--amber-dim);color:var(--amber);}
  .badge-medium{background:var(--blue-dim);color:var(--blue);}
  .badge-low{background:var(--bat-low-bg); color:var(--chalk-faint);}
  .badge-open{background:var(--blue-dim);color:var(--blue);}
  .badge-acknowledged{background:var(--amber-dim);color:var(--amber);}
  .badge-resolved{background:var(--green-dim);color:var(--green);}
  .badge-dismissed{background:var(--bat-dismiss-bg);color:var(--bat-dismiss-fg);}

  .dot{width:7px;height:7px;border-radius:50%;display:inline-block;}
  .dot-critical{background:var(--orange);}
  .dot-high{background:var(--amber);}
  .dot-medium{background:var(--blue);}
  .dot-low{background:var(--chalk-faint);}

  .alert-card{
    border:1px solid var(--grid-line);border-left:3px solid var(--grid-line);background:var(--navy-panel-2);
    padding:14px 16px;margin-bottom:10px;border-radius:2px;cursor:pointer;transition:border-color .12s;
  }
  .alert-card:hover{border-color:var(--chalk-faint);}
  .alert-card.critical{border-left-color:var(--orange);}
  .alert-card.high{border-left-color:var(--amber);}
  .alert-card.medium{border-left-color:var(--blue);}
  .alert-card.low{border-left-color:var(--chalk-faint);}
  .alert-card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .alert-card .title{font-size:15px;font-weight:600;color:var(--chalk);margin-bottom:3px;}
  .alert-card .proj{font-size:12px;color:var(--chalk-faint);font-family:'IBM Plex Mono',monospace;}
  .alert-card .summary{font-size:13px;color:var(--chalk-dim);margin-top:6px;line-height:1.5;}

  .evt-card{border:1px solid var(--grid-line);background:var(--navy);padding:12px 14px;margin-bottom:8px;border-radius:2px;}
  .evt-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .evt-type{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--chalk-faint);text-transform:uppercase;letter-spacing:0.04em;}
  .evt-conf{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--chalk-faint);}
  .fsi-row{display:grid;grid-template-columns:74px 1fr;gap:8px;font-size:12.5px;margin-top:5px;line-height:1.5;}
  .fsi-label{font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;color:var(--chalk-faint);padding-top:1px;}
  .fsi-fact .fsi-label{color:var(--green);}
  .fsi-signal .fsi-label{color:var(--blue);}
  .fsi-inference .fsi-label{color:var(--amber);}
  .fsi-rec .fsi-label{color:var(--orange);}

  .tabs{display:flex;gap:2px;background:var(--grid-line);border:1px solid var(--grid-line);width:fit-content;margin-bottom:16px;}
  .tab{padding:8px 16px;background:var(--navy-panel);color:var(--chalk-faint);font-size:13px;font-weight:600;border:none;}
  .tab.active{background:var(--navy-panel-2);color:var(--orange);}

  .empty{text-align:center;padding:40px 20px;color:var(--chalk-faint);font-size:14px;}
  .empty .big{font-size:15px;color:var(--chalk-dim);margin-bottom:6px;}

  .chip{display:inline-block;padding:3px 9px;border:1px solid var(--grid-line);border-radius:2px;font-size:11px;color:var(--chalk-dim);margin:0 6px 6px 0;font-family:'IBM Plex Mono',monospace;}

  .modal-bg{position:fixed;inset:0;background:rgba(6,10,18,0.72);display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;z-index:50;overflow:auto;}
  .modal{background:var(--navy);border:1px solid var(--grid-line);max-width:620px;width:100%;padding:26px 28px;border-radius:2px;}
  .modal h2{margin-bottom:4px;}
  .modal .sub{color:var(--chalk-faint);font-size:13px;margin-bottom:20px;}

  .divider{height:1px;background:var(--grid-line);margin:16px 0;}

  .onboard-wrap{max-width:640px;margin:40px auto;padding:0 20px;}
  .onboard-step{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--orange);margin-bottom:6px;letter-spacing:0.05em;}

  .flow-node{display:flex;align-items:center;gap:8px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--chalk-faint);}
  .flow-arrow{color:var(--grid-line);}

  .capture-modes{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .mode-btn{padding:8px 14px;border:1px solid var(--grid-line);background:var(--navy);color:var(--chalk-dim);font-size:13px;font-weight:600;border-radius:2px;}
  .mode-btn.active{background:var(--orange-dim);color:var(--orange);border-color:var(--orange);}

  .processing{display:flex;align-items:center;gap:10px;color:var(--amber);font-size:13px;font-family:'IBM Plex Mono',monospace;padding:10px 0;}
  .spinner{width:13px;height:13px;border:2px solid var(--amber-dim);border-top-color:var(--amber);border-radius:50%;animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .exposure-box{display:flex;align-items:baseline;gap:8px;padding:10px 14px;background:var(--navy);border:1px solid var(--grid-line);border-radius:2px;margin-top:8px;}
  .exposure-box .amt{font-family:'IBM Plex Mono',monospace;font-size:18px;color:var(--orange);font-weight:600;}
  .exposure-box .lbl{font-size:12px;color:var(--chalk-faint);}
  .exposure-unknown{color:var(--chalk-faint);font-size:13px;font-style:italic;}

  /* ---- About / Legal ---- */
  .legal-disclaimer{background:#3A1512;border:1px solid var(--orange);border-left:4px solid var(--orange);padding:12px 14px;border-radius:2px;margin-bottom:14px;}
  .legal-disclaimer .head{color:var(--orange);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:5px;font-family:'IBM Plex Mono',monospace;}
  .legal-disclaimer .body{font-size:12.5px;color:var(--chalk-dim);line-height:1.5;}
  .legal-doc-header{display:flex;justify-content:space-between;align-items:center;cursor:pointer;padding:10px 0;border-bottom:1px solid var(--grid-line);}
  .legal-doc-header h3{font-size:16px;color:var(--chalk);}
  .legal-doc-body{padding:14px 0 4px 0;font-size:13px;line-height:1.6;color:var(--chalk-dim);max-height:340px;overflow-y:auto;}
  .legal-doc-body h4{font-size:13.5px;color:var(--chalk);margin:14px 0 6px 0;}
  .legal-doc-body p{margin:0 0 10px 0;}
  .legal-doc-body ul{margin:0 0 10px 0;padding-left:20px;}
  .legal-doc-body li{margin-bottom:5px;}

  .ask-msg{margin-bottom:16px;}
  .ask-msg.user{color:var(--chalk-dim);font-size:14px;}
  .ask-msg.user .who{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--blue);margin-bottom:4px;}
  .ask-msg.ai .who{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--orange);margin-bottom:4px;}
  .ask-msg.ai .body{background:var(--navy-panel);border:1px solid var(--grid-line);padding:12px 14px;border-radius:2px;font-size:14px;line-height:1.6;color:var(--chalk);}

  .brief-block{margin-bottom:22px;}
  .brief-num{font-family:'IBM Plex Mono',monospace;color:var(--chalk-faint);margin-right:8px;}
  .link-row{color:var(--chalk-dim);font-size:14px;padding:8px 0;border-bottom:1px solid var(--grid-line-soft);cursor:pointer;}
  .link-row:hover{color:var(--chalk);}

  .scan-hero{text-align:center;padding:36px 20px;}
  .scan-hero h2{font-size:34px;margin-bottom:10px;}
  .scan-hero p{color:var(--chalk-faint);max-width:480px;margin:0 auto;}

  .kbd-hint{font-size:11px;color:var(--chalk-faint);font-family:'IBM Plex Mono',monospace;margin-top:6px;}
  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-track{background:var(--navy-deep);}
  ::-webkit-scrollbar-thumb{background:var(--grid-line);border-radius:5px;}

  /* ---- Mic input (Web Speech API) ---- */
  .field-with-mic{position:relative;}
  .mic-btn{
    position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;
    background:var(--navy);border:1px solid var(--grid-line);color:var(--chalk-dim);
    display:flex;align-items:center;justify-content:center;padding:0;font-size:13px;z-index:2;
  }
  html[dir="rtl"] .mic-btn{right:auto;left:6px;}
  .mic-btn:hover{border-color:var(--chalk-faint);color:var(--chalk);}
  .mic-btn.recording{background:var(--orange);border-color:var(--orange);color:#1A0D06;animation:pulse 1.1s ease-in-out infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,106,61,0.5);}50%{box-shadow:0 0 0 6px rgba(255,106,61,0);}}
  .field-with-mic textarea, .field-with-mic input[type=text]{padding-right:38px;}
  html[dir="rtl"] .field-with-mic textarea, html[dir="rtl"] .field-with-mic input[type=text]{padding-right:11px;padding-left:38px;}
  .mic-unsupported{font-size:10px;color:var(--chalk-faint);margin-top:4px;}

  /* ---- Scrollable list regions (used so the outer app frame never scrolls —
     only a bounded panel does, once its content genuinely exceeds it) ---- */
  .scroll-list{max-height:100%;overflow-y:auto;}
  .content-split{display:flex;gap:2px;flex:1;height:100%;min-height:0;}
  .split-col{flex:1 1 0;min-width:0;min-height:0;display:flex;flex-direction:column;gap:12px;padding:0 6px;}
  .split-col .panel{min-height:0;display:flex;flex-direction:column;margin-bottom:0;}
  .split-col .panel .scroll-list{flex:1;}
  .split-col .scroll-list{flex:1;min-height:0;}
  .split-handle{width:10px;flex:0 0 10px;cursor:col-resize;display:flex;align-items:center;justify-content:center;user-select:none;touch-action:none;color:var(--chalk-faint);}
  .split-handle::before{content:'';width:2px;height:34px;background:var(--grid-line);border-radius:2px;}
  .split-handle:hover::before{background:var(--orange);}
  html[dir="rtl"] .split-handle{scale:-1 1;}
  body.col-resizing, body.col-resizing *{cursor:col-resize !important;user-select:none;}

  /* ---- Admin tools live in their own section, below the daily tools ---- */
  .nav-section{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.14em;color:var(--chalk-faint);padding:12px 11px 4px 11px;text-transform:uppercase;}
  .nav-sep{height:1px;background:var(--grid-line);margin:8px 8px 2px 8px;}

  /* ---- Next-touch guidance: the one action each screen wants you to take
     next glows faintly so your eye lands on it immediately ---- */
  .next-touch{position:relative;animation:nextGlow 2.2s ease-in-out infinite;}
  @keyframes nextGlow{
    0%,100%{box-shadow:0 0 0 0 rgba(255,106,61,0.35);}
    50%{box-shadow:0 0 0 7px rgba(255,106,61,0);}
  }
  @media (prefers-reduced-motion: reduce){ .next-touch{animation:none;} }

  /* ---- Feedback box (About) ---- */
  .feedback-box textarea{min-height:74px;}

  /* ---- Compact stacked screens on phones: split columns drop into rows ---- */
  @media (max-width:760px){
    .content-split{flex-direction:column;}
    .split-col{flex:1 1 0;}
    .split-handle{display:none;}
    .content{padding:10px 14px 12px 14px;}
    .topbar{padding:8px 14px;flex-wrap:wrap;}
    .stat-row{grid-template-columns:repeat(auto-fit,minmax(96px,1fr));}
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
/* =========================================================
   FORESITE — prototype build (formerly "Jobsite Intelligence")
   Deterministic risk/financial engine in JS.
   AI extraction/Q&A via Claude API (structured JSON only).
   ========================================================= */

const STORE_KEY = 'jobsite-intel-v1'; // kept as-is intentionally so existing saved data isn't lost by the rename to Foresite

/* ---- Storage layer (IndexedDB with localStorage fallback) ----
   Before this existed, window.storage was never defined, so nothing ever
   saved and every reload wiped all data. Photos and voice data can be large,
   which is why we use IndexedDB rather than localStorage alone. */
(function(){
  const DB_NAME='foresite-kv', STORE='kv';
  let dbp=null;
  function open(){
    if(dbp) return dbp;
    if(!('indexedDB' in window)){
      dbp = Promise.resolve({local:true});
      return dbp;
    }
    dbp = new Promise((res,rej)=>{
      const rq = indexedDB.open(DB_NAME,1);
      rq.onupgradeneeded = ()=>{ const db=rq.result; if(!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE); };
      rq.onsuccess = ()=>res(rq.result);
      rq.onerror = ()=>rej(rq.error);
    });
    return dbp;
  }
  function lsGet(k){ try{ const v=localStorage.getItem('foresite::'+k); return v?{value:v}:null; }catch(e){ return null; } }
  function lsSet(k,v){ try{ localStorage.setItem('foresite::'+k,v); }catch(e){ console.error('localStorage quota:', e); } }
  window.storage = {
    async get(key){
      try{
        const db = await open();
        if(db.local) return lsGet(key);
        return await new Promise(res=>{
          const tx=db.transaction(STORE,'readonly');
          const rq=tx.objectStore(STORE).get(key);
          rq.onsuccess = ()=>res(rq.result?{value:rq.result.value}:null);
          rq.onerror = ()=>res(lsGet(key));
        });
      }catch(e){ return lsGet(key); }
    },
    async set(key,value){
      try{
        const db = await open();
        if(db.local){ lsSet(key,value); return Promise.resolve(); }
        return await new Promise((res,rej)=>{
          const tx=db.transaction(STORE,'readwrite');
          tx.objectStore(STORE).put({key:key,value:value}, key);
          tx.oncomplete = res;
          tx.onerror = ()=>rej(tx.error);
        });
      }catch(e){ lsSet(key,value); }
    },
    async remove(key){
      try{
        const db = await open();
        if(db.local){ localStorage.removeItem('foresite::'+key); return Promise.resolve(); }
        return await new Promise(res=>{
          const tx=db.transaction(STORE,'readwrite');
          tx.objectStore(STORE).delete(key);
          tx.oncomplete = res;
          tx.onerror = res;
        });
      }catch(e){ try{ localStorage.removeItem('foresite::'+key); }catch(e2){} }
    }
  };
})();

/* ---------------- multi-currency display ----------------
   Currency is a DISPLAY choice stored in state.settings.currency. All internal
   math stays in plain numbers (USD-style units); fmtMoney converts them for the
   user's eye. If a symbol-override is defined, we fall back to it when
   Intl.NumberFormat lacks a Territory data set. */
const CURRENCIES = {
  USD:{code:'USD',symbol:'$',locale:'en-US'}, EUR:{code:'EUR',symbol:'€',locale:'de-DE'},
  GBP:{code:'GBP',symbol:'£',locale:'en-GB'}, CAD:{code:'CAD',symbol:'C$',locale:'en-CA'},
  AUD:{code:'AUD',symbol:'A$',locale:'en-AU'}, SGD:{code:'SGD',symbol:'S$',locale:'en-SG'},
  INR:{code:'INR',symbol:'₹',locale:'en-IN'}, JPY:{code:'JPY',symbol:'¥',locale:'ja-JP'},
  CNY:{code:'CNY',symbol:'CN¥',locale:'zh-CN'}, KRW:{code:'KRW',symbol:'₩',locale:'ko-KR'},
  THB:{code:'THB',symbol:'฿',locale:'th-TH'}, VND:{code:'VND',symbol:'₫',locale:'vi-VN'},
  IDR:{code:'IDR',symbol:'Rp',locale:'id-ID'}, BRL:{code:'BRL',symbol:'R$',locale:'pt-BR'},
  TRY:{code:'TRY',symbol:'₺',locale:'tr-TR'}, MXN:{code:'MXN',symbol:'MX$',locale:'es-MX'},
  NGN:{code:'NGN',symbol:'₦',locale:'en-NG'}, AED:{code:'AED',symbol:'AED',locale:'en-AE'},
  SAR:{code:'SAR',symbol:'SAR',locale:'en-SA'}, MYR:{code:'MYR',symbol:'RM',locale:'en-MY'},
  PHP:{code:'PHP',symbol:'₱',locale:'en-PH'}, ZAR:{code:'ZAR',symbol:'R',locale:'en-ZA'}
};
function currencyCode(){ return (state.settings && state.settings.currency) || 'USD'; }
function currencySymbol(){ const c = CURRENCIES[currencyCode()]; return c ? c.symbol : '$'; }
function fmtMoney(n){
  if(n==null) return '—';
  const cur = CURRENCIES[currencyCode()];
  try{
    return new Intl.NumberFormat(cur ? cur.locale : appLocale(), {
      style:'currency', currency: currencyCode(), maximumFractionDigits: 0
    }).format(n);
  }catch(e){
    return currencySymbol() + Math.round(n).toLocaleString(appLocale());
  }
}
function todayStr(){ return new Date().toLocaleDateString(appLocale(),{weekday:'long',month:'short',day:'numeric'}); }
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---- Speech-to-text (Web Speech API) — every free-text field gets a mic button. ---- */
function micButtonHtml(targetId){
  const supported = !!(window.SpeechRecognition || window.webkitSpeechRecognition);
  if(!supported) return '';
  return `<button type="button" class="mic-btn" data-mic-for="${targetId}" title="${escapeHtml(t('mode_voice'))}">🎤</button>`;
}
function wireMicButtons(){
  document.querySelectorAll('[data-mic-for]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const targetId = btn.dataset.micFor;
      const input = document.getElementById(targetId);
      if(!input) return;
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if(!SR){ alert(t('mic_unsupported')); return; }
      if(btn._recognition){ btn._recognition.stop(); return; }
      const rec = new SR();
      rec.lang = LANG_SPEECH_CODE[state.ui.lang] || 'en-US';
      rec.interimResults = false;
      rec.maxAlternatives = 1;
      btn.classList.add('recording');
      btn._recognition = rec;
      rec.onresult = (e)=>{
        const transcript = Array.from(e.results).map(r=>r[0].transcript).join(' ');
        const sep = input.value && !input.value.endsWith(' ') ? ' ' : '';
        input.value = (input.value||'') + sep + transcript;
        input.dispatchEvent(new Event('input'));
      };
      rec.onerror = (e)=>{
        btn.classList.remove('recording'); btn._recognition=null;
        if(e.error==='not-allowed' || e.error==='service-not-allowed'){ alert(t('mic_permission_denied')); }
      };
      rec.onend = ()=>{ btn.classList.remove('recording'); btn._recognition=null; };
      rec.start();
    });
  });
}

/* ---------------- risk + financial engine (deterministic) ---------------- */
function computeSeverity(p,i,u){
  const score = Math.round(Math.cbrt(Math.max(1,p)*Math.max(1,i)*Math.max(1,u)));
  let band='LOW';
  if(score>=80) band='CRITICAL'; else if(score>=60) band='HIGH'; else if(score>=35) band='MEDIUM';
  return {score, band};
}

function computeExposure(evt, assumptions){
  const fs = evt.financial_signals || {};
  const conf = evt.confidence ?? 0.5;
  const uncertainty = 0.15 + (1-conf)*0.35; // wider range when less confident
  let base = null, category = null, method = '';

  if(fs.stated_dollar_amount){
    base = fs.stated_dollar_amount;
    method = 'Amount stated directly in source.';
  } else if(fs.material_quantity && fs.known_unit_cost){
    base = fs.material_quantity * fs.known_unit_cost * (1+assumptions.materialMarkup);
    method = `${fs.material_quantity} ${fs.material_unit||'units'} × $${fs.known_unit_cost}/unit + material markup.`;
  } else if(fs.affected_hours){
    base = fs.affected_hours * assumptions.laborRate;
    method = `${fs.affected_hours} affected hours × $${assumptions.laborRate}/hr loaded labor rate.`;
  }

  const isRevenue = ['SCOPE_CHANGE','EXTRA_WORK','UNPRICED_WORK','CUSTOMER_REQUEST'].includes(evt.type);
  const isSchedule = ['MATERIAL_DELAY','MATERIAL_SHORTAGE','CREW_DELAY','CREW_IDLE','TRADE_DELAY','DEPENDENCY_BLOCKED','SCHEDULE_RISK','MILESTONE_RISK','COMPLETION_RISK'].includes(evt.type);
  category = isRevenue ? 'REVENUE_OPPORTUNITY' : (isSchedule ? 'SCHEDULE_EXPOSURE' : 'COST_EXPOSURE');

  if(base==null){
    return { id:uid('exp'), eventId:evt.id, projectId:evt.projectId, category, low:null, high:null,
      confidence:conf, calculation_method:'Insufficient information to estimate value.', status:'POTENTIAL', hasAmount:false };
  }
  return {
    id:uid('exp'), eventId:evt.id, projectId:evt.projectId, category,
    low: Math.max(0, Math.round(base*(1-uncertainty))),
    high: Math.round(base*(1+uncertainty)),
    confidence: conf, calculation_method: method, status:'POTENTIAL', hasAmount:true
  };
}

/* Double-counting protection (spec §33): events that cascaded from the same raw input
   (same chainId) are treated as ONE underlying economic event for the "unique" total —
   we take the largest single exposure in the chain rather than summing every downstream
   effect. Standalone events (no chain) are summed normally. */
function uniqueExposureTotal(exposures){
  const chains = {}; let standalone = 0;
  exposures.forEach(exp=>{
    const evt = state.events.find(e=>e.id===exp.eventId);
    const chainId = evt && evt.chainId;
    if(chainId){ (chains[chainId] = chains[chainId]||[]).push(exp); }
    else { standalone += exp.high; }
  });
  let chainTotal = 0;
  Object.values(chains).forEach(list=>{ chainTotal += Math.max(...list.map(e=>e.high)); });
  return standalone + chainTotal;
}

function maybeCreateAlert(evt, exposure){
  // Alert gate: confidence threshold + meaningful severity/impact, skip trivial LOW with no exposure
  if(evt.confidence < 0.4) return null;
  if(evt.severity_band==='LOW' && !exposure.hasAmount) return null;
  // dedupe: same project+type+title already open in last 20 alerts
  const dup = state.alerts.find(a=>a.projectId===evt.projectId && a.eventType===evt.type && a.title===evt.title && a.status!=='DISMISSED');
  if(dup) return null;
  return {
    id: uid('alrt'), projectId: evt.projectId, eventId: evt.id, exposureId: exposure.id,
    eventType: evt.type, severity: evt.severity_band, title: evt.title,
    summary: evt.description, why_it_matters: evt.inference || evt.signal || 'May affect project cost, schedule, or documentation.',
    recommended_action: evt.recommendation || 'Review and confirm details with the field.',
    confidence: evt.confidence, status:'OPEN', createdAt: Date.now()
  };
}

- If nothing meaningful is present, return {"events":[]}.
- Never invent dollar amounts, dates, quantities, or approvals that are not stated or clearly implied.
- For each event give: type (from the list), title (short), description (1-2 sentences), confidence (0-1),
  fact (what is directly stated, or null), signal (what this implies is connected/at risk, or null),
  inference (the AI-derived conclusion, or null), recommendation (a concrete suggested next action),
  entities (array of short strings: people/subs/materials/tasks mentioned),
  financial_signals: { affected_hours: number|null, material_quantity: number|null, material_unit: string|null, known_unit_cost: number|null, stated_dollar_amount: number|null } — only fill fields explicitly supported by the input, else null,
  risk_factors: { probability: 0-100, impact: 0-100, urgency: 0-100 } reflecting your best structured judgment of likelihood, business impact, and time pressure.
- Be conservative on photos: never assert structural, safety, or legal conclusions — say "possible X, review recommended" style language in description/inference.
- Do not assign blame to a specific subcontractor unless the input explicitly names a repeated pattern; use neutral language like "recurring issue pattern detected".
- A vague or distant hypothetical ("asked about someday adding X next year") should get low confidence and low urgency, not treated as an active event.
- Write all of title, description, fact, signal, inference, and recommendation natively in ${LANG_FULL_NAME[state.ui.lang] || 'English'} — the field team and management using this system work in that language. entities may keep proper nouns as given. Keep the JSON keys themselves in English exactly as specified.

Return JSON of shape: {"events":[ { ...as above... } ]}`; }

async function callClaude(system, messages, maxTokens){
  const apiKey = (state.settings && state.settings.apiKey) || '';
  if(!apiKey) throw new Error('NO_API_KEY');
  const resp = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "x-api-key": apiKey,
      "anthropic-version":"2023-06-01",
      "anthropic-dangerous-direct-browser-access":"true"
    },
    body: JSON.stringify({
      model:"claude-sonnet-4-6",
      max_tokens: maxTokens || 1000,
      system: system,
      messages: messages
    })
  });
  if(!resp.ok){ const detail = await resp.text().catch(()=>''); throw new Error('HTTP '+resp.status+' '+(resp.status===401||resp.status===403?'AUTH':'')+detail); }
  const data = await resp.json();
  const text = (data.content||[]).map(b=>b.text||'').join('\n');
  return text;
}

function parseJsonLoose(text){
  let clean = text.replace(/```json/gi,'').replace(/```/g,'').trim();
  try{ return JSON.parse(clean); }
  catch(e){
    const m = clean.match(/\{[\s\S]*\}/);
    if(m){ try{ return JSON.parse(m[0]); }catch(e2){} }
    return null;
  }
}

async function extractFromInput(rawInput){
  let userContent = [];
  if(rawInput.type==='photo'){
    userContent.push({type:'image', source:{type:'base64', media_type: rawInput.mediaType, data: rawInput.base64}});
    userContent.push({type:'text', text:'Field photo submitted from the jobsite. Extract any meaningful events per your instructions (be conservative — describe possible issues, never assert defects definitively).' + (rawInput.caption?(' Caption: '+rawInput.caption):'')});
  } else if(rawInput.type==='pdf'){
    userContent.push({type:'document', source:{type:'base64', media_type:'application/pdf', data: rawInput.base64}});
    userContent.push({type:'text', text:'Document submitted from the jobsite (supplier notice, invoice, schedule, etc). Extract any meaningful events.'});
  } else {
    userContent.push({type:'text', text: `${rawInput.type==='voice'?'Voice note transcript':'Field text update'}: "${rawInput.content}"`});
  }
  const raw = await callClaude(getExtractionSystem(), [{role:'user', content:userContent}], 1200);
  const parsed = parseJsonLoose(raw);
  return (parsed && Array.isArray(parsed.events)) ? parsed.events : [];
}

async function askMyJobs(question){
  const q = question.toLowerCase();
  const words = q.split(/\W+/).filter(w=>w.length>3);
  function scoreItem(text){
    text = (text||'').toLowerCase();
    return words.reduce((s,w)=> s + (text.includes(w)?1:0), 0);
  }
  const projMap = {}; state.projects.forEach(p=>projMap[p.id]=p.name);
  let scored = state.alerts.map(a=>({
    a, s: scoreItem(a.title+' '+a.summary+' '+a.why_it_matters+' '+(projMap[a.projectId]||''))
  }));
  scored.sort((x,y)=>y.s-x.s);
  let top = scored.filter(x=>x.s>0).slice(0,8).map(x=>x.a);
  if(top.length===0) top = state.alerts.slice(-8); // fallback: most recent
  const evidence = top.map(a=>({
    id:a.id, project: projMap[a.projectId]||'Unknown', severity:a.severity, title:a.title,
    summary:a.summary, why_it_matters:a.why_it_matters, recommended_action:a.recommended_action,
    status:a.status, confidence:a.confidence
  }));
  const system = `You are "Ask My Jobs", the management Q&A layer of a construction jobsite-intelligence system.
Answer ONLY using the JSON evidence array provided by the user message — never invent projects, numbers, or events not present in it.
If the evidence doesn't answer the question, say plainly that nothing in the current data answers it.
Reference alerts by their project name and title (not raw ids). Be concise — a few sentences, management-brief tone, no headers, no markdown.
Respond natively in ${LANG_FULL_NAME[state.ui.lang] || 'English'}, regardless of what language the evidence text is in.`;
  const userMsg = `QUESTION: ${question}\n\nEVIDENCE (JSON):\n${JSON.stringify(evidence)}`;
  const answer = await callClaude(system, [{role:'user', content:userMsg}], 500);
  return answer.trim();
}

/* ---------------- pipeline: raw input -> events -> exposures -> alerts ---------------- */
async function processRawInput(rawInput){
  rawInput.processing_status = 'processing';
  state.rawInputs.unshift(rawInput);
  render();
  let events = [];
  try{
    events = await extractFromInput(rawInput);
  }catch(e){
    console.error(e);
    rawInput.error = (e && e.message==='NO_API_KEY') ? t('ai_key_missing') : t('ask_error');
  }
  rawInput.processing_status = 'done';
  const createdAlerts = [];
  const batchEvents = [];
  let prevId = null;
  events.forEach(raw=>{
    if(!ALL_EVENT_TYPES.includes(raw.type)) return;
    const rf = raw.risk_factors || {probability:40,impact:40,urgency:40};
    const sev = computeSeverity(rf.probability??40, rf.impact??40, rf.urgency??40);
    const evt = {
      id: uid('evt'), projectId: rawInput.projectId, sourceId: rawInput.id, type: raw.type,
      title: raw.title || raw.type, description: raw.description||'', confidence: raw.confidence ?? 0.5,
      fact: raw.fact||null, signal: raw.signal||null, inference: raw.inference||null, recommendation: raw.recommendation||null,
      entities: raw.entities||[], financial_signals: raw.financial_signals||{}, risk_factors: rf,
      severity_score: sev.score, severity_band: sev.band, occurredAt: Date.now(),
      chainId: rawInput.id, causedBy: prevId // sequential cascade link within one input batch
    };
    prevId = evt.id;
    state.events.unshift(evt);
    batchEvents.push(evt);
    const exposure = computeExposure(evt, state.assumptions);
    state.exposures.unshift(exposure);
    const alert = maybeCreateAlert(evt, exposure);
    if(alert){ state.alerts.unshift(alert); createdAlerts.push(alert); }
  });
  // Cross-input intelligence: recurring problems + weak-signal ("silent risk") accumulation
  detectRecurringPatterns().forEach(a=>{ state.alerts.unshift(a); createdAlerts.push(a); });
  detectSilentRisk(rawInput.projectId, batchEvents).forEach(a=>{ state.alerts.unshift(a); createdAlerts.push(a); });
  saveState();
  render();
  return createdAlerts;
}

/* ---- R008: recurring problem engine ---- */
/* Groups events by shared entity mentions (trade/sub/material) across a project's history.
   3+ occurrences of the same entity within the tracked window => a RECURRING_PROBLEM event+alert. */
/* R010 — unacknowledged critical event (spec §21). A high-impact alert sitting OPEN past a
   configurable age threshold gets flagged for escalation, even though nothing new has
   happened — the passage of time itself is the signal. Acknowledging/actioning it counts
   as "management knows" and clears the flag regardless of age. */
const AGING_THRESHOLDS_MS = { CRITICAL: 24*3600*1000, HIGH: 72*3600*1000 };
function detectAgingAlerts(now){
  now = now ?? Date.now();
  const defaults = state.settings?.agingAlertDefaults || {
    criticalMs: 24 * 60 * 60 * 1000,
    highMs: 72 * 60 * 60 * 1000
  };

  return state.alerts.filter(a => {
    if (a.status !== 'OPEN') return false;

    const customThreshold = state.settings?.alertOverrides?.[a.id]?.customMs;
    const threshold = customThreshold !== undefined
      ? customThreshold
      : (a.severity === 'CRITICAL' ? defaults.criticalMs : defaults.highMs);

    return (now - a.createdAt) > threshold;
  }).map(a => ({
    alertId: a.id,
    ageHours: Math.round((now - a.createdAt) / 3600000),
    hasCustomReminder: !!state.settings?.alertOverrides?.[a.id],
    overrideHours: state.settings?.alertOverrides?.[a.id]?.customMs
      ? Math.round(state.settings.alertOverrides[a.id].customMs / 3600000)
      : null
  }));
}

function detectRecurringPatterns(){
  const created = [];
  const byEntity = {};
  state.events.forEach(e=>{
    if(e.type==='RECURRING_PROBLEM') return;
    (e.entities||[]).forEach(ent=>{
      const key = e.projectId+'::'+ent.toLowerCase();
      (byEntity[key] = byEntity[key]||[]).push(e);
    });
  });
  Object.entries(byEntity).forEach(([key, evs])=>{
    if(evs.length < 3) return;
    const [projectId, entity] = key.split('::');

    const suppression = (state.settings?.suppressedPatterns || []).find(s => s.patternKey === key);
    if(suppression){
      if(suppression.action === 'once') return;
      if(suppression.action === 'always') return;
    }

    const alreadyFlagged = state.events.some(e=>e.type==='RECURRING_PROBLEM' && e.projectId===projectId && (e.entities||[]).includes(entity));
    if(alreadyFlagged) return;
    const types = [...new Set(evs.map(e=>e.type))];
    const rf = {probability:70, impact:55, urgency:45};
    const sev = computeSeverity(rf.probability, rf.impact, rf.urgency);
    const evt = {
      id: uid('evt'), projectId, sourceId: null, type:'RECURRING_PROBLEM',
      title: `Recurring issue pattern: ${entity}`,
      description: `${evs.length} separate issues (${types.join(', ').toLowerCase()}) linked to "${entity}" have been logged on this project.`,
      confidence: 0.7,
      fact: `${evs.length} logged events reference "${entity}".`,
      signal: 'The same entity keeps generating issues rather than this being a one-off.',
      inference: 'This is likely a systemic pattern rather than isolated incidents.',
      recommendation: `Review recent work involving "${entity}" directly with the site lead before it recurs again.`,
      entities:[entity], financial_signals:{}, risk_factors: rf,
      severity_score: sev.score, severity_band: sev.band, occurredAt: Date.now(), chainId:null, causedBy:null,
      relatedEventIds: evs.map(e=>e.id)
    };
    state.events.unshift(evt);
    const exposure = computeExposure(evt, state.assumptions);
    state.exposures.unshift(exposure);
    const alert = maybeCreateAlert(evt, exposure);
    if(alert) created.push(alert);
  });
  return created;
}

/* ---- R009 / "management doesn't know" detector ----
   No single update looks urgent, but 3+ weak signals about the same topic, on the same
   project, in the recent window, collectively indicate a real risk nobody has escalated.
   Matches primarily on extracted entities (structured, reliable), falling back to keyword
   overlap with length>=4 minus a stopword list. NOTE: an earlier version filtered words to
   length>4, which silently dropped 4-letter words like "tile" and "crew" — exactly the terms
   that connect this spec's own canonical example — so it never fired. Caught by the
   acceptance test suite; fixed here. */
const SILENT_RISK_STOPWORDS = new Set(['this','that','from','been','have','still','again','today','after','need','needs','into','with','they','them','were','being','once','more','than','also']);
function detectSilentRisk(projectId, newBatchEvents){
  const created = [];
  const config = state.settings?.silentRiskConfig || { weakSignalThreshold:45, minClusterSize:3 };
  if(!config.enabled) return created;

  const recent = state.events.filter(e=>e.projectId===projectId && e.type!=='RECURRING_PROBLEM' && e.chainId!==null).slice(0,25);
  newBatchEvents.forEach(evt=>{
    const evtEntities = new Set((evt.entities||[]).map(x=>x.toLowerCase()));
    const words = (evt.title+' '+evt.description).toLowerCase().split(/\W+/)
      .filter(w=>w.length>=4 && !SILENT_RISK_STOPWORDS.has(w));
    const related = recent.filter(e=>{
      if(e.id===evt.id) return false;
      const eEntities = (e.entities||[]).map(x=>x.toLowerCase());
      if(eEntities.some(x=>evtEntities.has(x))) return true;
      const t = (e.title+' '+e.description).toLowerCase();
      return words.some(w=>t.includes(w));
    });
    if(related.length < 2) return;
    const alreadyEscalated = state.alerts.some(a=>a.title.startsWith('Management attention required') && a.projectId===projectId && a.summary.includes(evt.title));
    if(alreadyEscalated) return;
    const allInvolved = [evt, ...related];
    if(allInvolved.every(e=>e.severity_band==='LOW'||e.severity_band==='MEDIUM')){
      const rf = {probability:75, impact:55, urgency:60};
      const sev = computeSeverity(rf.probability, rf.impact, rf.urgency);
      const escEvt = {
        id: uid('evt'), projectId, sourceId:null, type:'SCHEDULE_RISK',
        title:`Management attention required: ${evt.title}`,
        description:`${allInvolved.length} separate field updates about this have come in without individually triggering a high-priority alert. Together they suggest a real problem.`,
        confidence:0.72,
        fact:`${allInvolved.length} related field updates logged.`,
        signal:'No single update read as urgent on its own.',
        inference:'Taken together, this pattern suggests the issue is worse than any one update implied — and may not have reached management yet.',
        recommendation:'Review the full thread of related updates and confirm the underlying issue is being actively managed.',
        entities:[], financial_signals:{}, risk_factors: rf, severity_score: sev.score, severity_band: sev.band,
        occurredAt: Date.now(), chainId:null, causedBy:null, relatedEventIds: allInvolved.map(e=>e.id)
      };
      state.events.unshift(escEvt);
      const exposure = computeExposure(escEvt, state.assumptions);
      state.exposures.unshift(exposure);
      const alert = maybeCreateAlert(escEvt, exposure);
      if(alert) created.push(alert);
    }
  });
  return created;
}

function el(html){ const d=document.createElement('div'); d.innerHTML=html; return d.firstElementChild; }

function projectName(id){ const p = state.projects.find(x=>x.id===id); return p?p.name:'Unknown project'; }

/* Project identification (spec §10): match on name/client/address keywords.
   Only auto-assigns when there's a clear, unambiguous leader — otherwise the
   caller must ask the user rather than silently attaching to the wrong job. */
function guessProjectId(text){
  if(!text || state.projects.length===0) return {projectId:null, confident:false};
  if(state.projects.length===1) return {projectId:state.projects[0].id, confident:true};
  const t = text.toLowerCase();
  const scores = state.projects.map(p=>{
    const words = `${p.name} ${p.client} ${p.address}`.toLowerCase().split(/\W+/).filter(w=>w.length>2);
    const score = words.reduce((s,w)=> s + (t.includes(w)?1:0), 0);
    return {id:p.id, score};
  }).sort((a,b)=>b.score-a.score);
  if(scores[0].score===0) return {projectId:null, confident:false};
  if(scores.length>1 && scores[0].score===scores[1].score) return {projectId:null, confident:false};
  return {projectId:scores[0].id, confident:true};
}

// ===== ENHANCEMENT HELPERS: AGING ALERTS =====
function setCustomAgingReminder(alertId, customHours) {
  if (!state.settings.alertOverrides) state.settings.alertOverrides = {};
  state.settings.alertOverrides[alertId] = {
    customMs: customHours * 60 * 60 * 1000,
    setAt: Date.now()
  };
  saveState();
  console.log(`Custom reminder set for alert ${alertId}: ${customHours} hours`);
}

function getAgingThreshold(alert) {
  const defaults = state.settings?.agingAlertDefaults || {
    criticalMs: 24 * 60 * 60 * 1000,
    highMs: 72 * 60 * 60 * 1000
  };
  const customThreshold = state.settings?.alertOverrides?.[alert.id]?.customMs;
  return customThreshold !== undefined
    ? customThreshold
    : (alert.severity === 'CRITICAL' ? defaults.criticalMs : defaults.highMs);
}

function saveAgingDefaults(criticalHours, highHours) {
  if (!state.settings.agingAlertDefaults) state.settings.agingAlertDefaults = {};
  state.settings.agingAlertDefaults.criticalMs = criticalHours * 60 * 60 * 1000;
  state.settings.agingAlertDefaults.highMs = highHours * 60 * 60 * 1000;
  saveState();
  console.log('✓ Aging defaults updated:', state.settings.agingAlertDefaults);
  render();
}

// ===== ENHANCEMENT HELPERS: RECURRING PATTERNS =====
function suppressPattern(patternKey, action = 'once', durationHours = 24) {
  if (!state.settings.suppressedPatterns) state.settings.suppressedPatterns = [];

  const existingIndex = state.settings.suppressedPatterns.findIndex(s => s.patternKey === patternKey);
  if (existingIndex >= 0) {
    state.settings.suppressedPatterns[existingIndex].action = action;
    state.settings.suppressedPatterns[existingIndex].suppressedAt = Date.now();
  } else {
    state.settings.suppressedPatterns.push({
      patternKey: patternKey,
      action: action,
      suppressedAt: Date.now(),
      expiresAt: action === 'once' ? Date.now() + (durationHours * 60 * 60 * 1000) : null
    });
  }
  saveState();
  console.log(`✓ Pattern suppressed: ${patternKey} (${action})`);
}

function isPatternSuppressed(patternKey) {
  const suppression = (state.settings?.suppressedPatterns || []).find(s => s.patternKey === patternKey);
  if (!suppression) return false;
  if (suppression.action === 'always') return true;
  if (suppression.action === 'once' && suppression.expiresAt && Date.now() < suppression.expiresAt) return true;
  return false;
}

function unsuppressPattern(patternKey) {
  if (!state.settings.suppressedPatterns) return;
  state.settings.suppressedPatterns = state.settings.suppressedPatterns.filter(s => s.patternKey !== patternKey);
  saveState();
  console.log(`✓ Pattern unsuppressed: ${patternKey}`);
  render();
}

// ===== ENHANCEMENT HELPERS: SILENT RISK =====
function updateSilentRiskConfig(threshold, minCluster, enabled) {
  if (!state.settings.silentRiskConfig) state.settings.silentRiskConfig = {};
  state.settings.silentRiskConfig.weakSignalThreshold = parseFloat(threshold);
  state.settings.silentRiskConfig.minClusterSize = parseInt(minCluster);
  state.settings.silentRiskConfig.enabled = enabled;
  saveState();
  console.log('✓ Silent Risk config updated:', state.settings.silentRiskConfig);
  render();
}

function rateSignal(signalId, rating) {
  if (!state.settings.signalFeedback) state.settings.signalFeedback = {};
  state.settings.signalFeedback[signalId] = {
    rating: rating,
    ratedAt: Date.now()
  };
  saveState();
  console.log(`✓ Signal ${signalId} rated ${rating}/5`);
}

function initializeAllEnhancements() {
  if (!state.settings.agingAlertDefaults) {
    state.settings.agingAlertDefaults = {
      criticalMs: 24 * 60 * 60 * 1000,
      highMs: 72 * 60 * 60 * 1000
    };
  }
  if (!state.settings.alertOverrides) state.settings.alertOverrides = {};
  if (!state.settings.suppressedPatterns) state.settings.suppressedPatterns = [];
  if (!state.settings.silentRiskConfig) {

}

/* ---------------- adjustable split panels ----------------
   Every .content-split gets its direct children wrapped in .split-col and a
   draggable .split-handle between them. Drag adjusts the flex-basis of the
   first column; the ratio is persisted per-tab so a user's preferred layout
   survives reloads. On mobile the handles are hidden and columns stack. */
let splitDrag = null;
function wireSplits(){
  document.querySelectorAll('.content-split').forEach(split=>{
    if(split.dataset.splitBound){ applySplitRatio(split); return; }
    split.dataset.splitBound = '1';
    split.querySelectorAll(':scope > div').forEach(col=>col.classList.add('split-col'));
    const cols = split.querySelectorAll(':scope > .split-col');
    for(let i=0;i<cols.length-1;i++){
      const h = document.createElement('div');
      h.className = 'split-handle';
      h.setAttribute('aria-hidden','true');
      cols[i].after(h);
      h.addEventListener('pointerdown', (e)=>{
        e.preventDefault();
        const aCol = h.previousElementSibling;
        const bCol = h.nextElementSibling;
        splitDrag = { split, aCol, bCol, startX: e.clientX, startA: aCol.getBoundingClientRect().width, startB: bCol.getBoundingClientRect().width, moved:false };
        document.body.classList.add('col-resizing');
        window.addEventListener('pointermove', onColDrag);
        window.addEventListener('pointerup', endColDrag);
      });
    }
    applySplitRatio(split);
  });
}
function onColDrag(e){
  if(!splitDrag) return;
  const dx = e.clientX - splitDrag.startX;
  const rtl = document.documentElement.getAttribute('dir')==='rtl';
  const a = Math.max(120, splitDrag.startA + (rtl ? -dx : dx));
  const b = Math.max(120, splitDrag.startB - (rtl ? -dx : dx));
  splitDrag.aCol.style.flex = `0 0 ${a}px`;
  splitDrag.bCol.style.flex = `0 0 ${b}px`;
  splitDrag.moved = true;
}
function endColDrag(){
  window.removeEventListener('pointermove', onColDrag);
  window.removeEventListener('pointerup', endColDrag);
  document.body.classList.remove('col-resizing');
  if(splitDrag && splitDrag.moved){
    const total = splitDrag.split.getBoundingClientRect().width;
    if(total>0){
      state.ui.splitRatios = state.ui.splitRatios || {};
      state.ui.splitRatios[state.ui.tab] = Math.round(splitDrag.aCol.getBoundingClientRect().width / total * 100);
      saveState();
    }
  }
  splitDrag = null;
}
function applySplitRatio(split){
  if(window.matchMedia && window.matchMedia('(max-width:760px)').matches) return;
  const ratio = (state.ui.splitRatios && state.ui.splitRatios[state.ui.tab]);
  const cols = split.querySelectorAll(':scope > .split-col');
  if(!ratio || cols.length<2) return;
  const total = split.getBoundingClientRect().width;
  if(total<=0) return;
  cols[0].style.flex = `0 0 ${Math.max(120, total*ratio/100)}px`;
  cols[1].style.flex = '1 1 0';
}

}

/* ---- Event Graph ---- */
/* Visualizes causal chains: sequential events extracted from one input (cascade),
   plus cross-input links surfaced by the recurring-problem and silent-risk detectors. */
function renderEventGraph(){
  const pids = state.ui.selectedProject==='all' ? state.projects.map(p=>p.id) : [state.ui.selectedProject];
  const evts = state.events.filter(e=>pids.includes(e.projectId));
  if(evts.length===0) return `<div class="empty"><div class="big">${t('no_events_yet')}</div>${t('graph_no_events_sub')}</div>`;

  // group into chains: (a) same raw-input cascade via chainId, (b) cross-input via relatedEventIds
  const byId = {}; evts.forEach(e=>byId[e.id]=e);
  const chains = {};
  evts.forEach(e=>{ if(e.chainId){ (chains[e.chainId]=chains[e.chainId]||[]).push(e); } });
  const crossLinks = evts.filter(e=>e.relatedEventIds && e.relatedEventIds.length);

  const typeColor = t=>{
    const g = EVENT_TAXONOMY[t];
    return ({Money:'var(--orange)',Materials:'var(--amber)',Labor:'var(--amber)',Dependencies:'var(--blue)',
      Quality:'var(--red)',Customer:'var(--blue)',Schedule:'var(--blue)',Documentation:'var(--chalk-faint)',
      Intelligence:'var(--green)'})[g] || 'var(--chalk-faint)';
  };

  let html = '';
  Object.entries(chains).forEach(([chainId, list])=>{
    list.sort((a,b)=>a.occurredAt-b.occurredAt);
    if(list.length<1) return;
    html += `<div class="panel"><div class="panel-title">${t('graph_cascade')}</div>`;
    list.forEach((e,i)=>{
      html += `<div class="flow-node" style="margin-bottom:${i<list.length-1?'2px':'0'};">
        <span class="dot" style="background:${typeColor(e.type)};"></span>
        <span style="color:var(--chalk);font-family:'Inter',sans-serif;font-size:14px;">${escapeHtml(e.title)}</span>
        <span class="mono" style="color:var(--chalk-faint);">(${e.type})</span>
      </div>`;
      if(i<list.length-1) html += `<div class="flow-arrow" style="padding-left:3px;">↓ ${t('graph_may_cause')}</div>`;
    });
    html += `</div>`;
  });

  if(crossLinks.length){
    html += `<div class="panel"><div class="panel-title">${t('graph_cross')}</div>`;
    crossLinks.forEach(e=>{
      const related = (e.relatedEventIds||[]).map(id=>byId[id]).filter(Boolean);
      html += `<div style="margin-bottom:14px;">
        <div style="display:flex;justify-content:space-between;"><strong style="font-size:14px;">${escapeHtml(e.title)}</strong>${sevBadge(e.severity_band)}</div>
        <div style="font-size:12.5px;color:var(--chalk-faint);margin:4px 0 6px 0;">${escapeHtml(e.description)}</div>
        <div style="padding-left:14px;border-left:2px solid var(--grid-line);">
          ${related.map(r=>`<div class="flow-node" style="margin-bottom:3px;"><span class="dot" style="background:${typeColor(r.type)};"></span>${escapeHtml(r.title)}</div>`).join('')}
        </div>
      </div>`;
    });
    html += `</div>`;
  }

  const standalone = evts.filter(e=>!e.chainId && !(e.relatedEventIds && e.relatedEventIds.length));
  if(standalone.length){
    html += `<div class="panel"><div class="panel-title">${t('graph_standalone')}</div>`;
    standalone.forEach(e=>{
      html += `<div class="flow-node" style="margin-bottom:6px;"><span class="dot" style="background:${typeColor(e.type)};"></span>${escapeHtml(e.title)} <span class="mono" style="color:var(--chalk-faint);">(${e.type})</span></div>`;
    });
    html += `</div>`;
  }
  return html;
}

/* ---- Daily Brief ---- */
function renderBrief(){
  const open = state.alerts.filter(a=>a.status==='OPEN'||a.status==='ACKNOWLEDGED');
  const urgent = open.filter(a=>a.severity==='CRITICAL').length;
  const important = open.filter(a=>a.severity==='HIGH').length;
  const healthy = state.projects.length - new Set(open.map(a=>a.projectId)).size;
  const top = open.slice().sort((a,b)=>({CRITICAL:0,HIGH:1,MEDIUM:2,LOW:3}[a.severity]-({CRITICAL:0,HIGH:1,MEDIUM:2,LOW:3}[b.severity]))).slice(0,3);
  const weekExposures = state.exposures.filter(e=>e.hasAmount);
  const weekLow = weekExposures.reduce((s,e)=>s+e.low,0), weekHigh = weekExposures.reduce((s,e)=>s+e.high,0);
  const verified = state.outcomes.filter(o=>o.verified).reduce((s,o)=>s+(o.amount||0),0);

  return `
  <div class="panel scroll-list" style="max-width:640px;height:100%;">
    <div class="brief-block">
      <div class="mono" style="color:var(--chalk-faint);font-size:12px;text-transform:uppercase;margin-bottom:6px;">${todayStr()}</div>
      <h2 style="font-size:24px;">${t('brief_good_morning')}</h2>
      <p style="color:var(--chalk-dim);margin-top:8px;">${state.projects.length} · ${urgent} ${t('stat_critical')} · ${important} ${t('stat_high')} · ${Math.max(0,healthy)}</p>
    </div>
    <div class="brief-block">
      <div class="panel-title">${t('brief_priorities')}</div>
      ${top.length===0?`<div class="empty">${t('brief_nothing_urgent')}</div>`:top.map((a,i)=>`
        <div class="link-row" data-open-alert="${a.id}"><span class="brief-num">${i+1}.</span><strong>${escapeHtml(projectName(a.projectId))}</strong> — ${escapeHtml(a.title)}</div>
      `).join('')}
    </div>
    <div class="brief-block">
      <div class="panel-title">${t('brief_this_week')}</div>
      <p style="font-size:14px;line-height:1.8;">
        <span class="mono" style="color:var(--orange);">${fmtMoney(weekLow)}–${fmtMoney(weekHigh)}</span> · ${t('stat_gross')}<br>
        <span class="mono" style="color:var(--green);">${fmtMoney(verified)}</span> · ${t('stat_verified')}
      </p>
    </div>
  </div>`;
}

        <div class="field" style="flex:1;"><label>High Timeout (hours)</label><input type="number" id="highHours" min="1" max="168" value="${(state.settings?.agingAlertDefaults?.highMs || 72*3600*1000)/3600000}"></div>

        <div class="field" style="flex:1;"><label>Weak Signal Threshold (%)</label><input type="range" id="signalThreshold" min="10" max="90" value="${state.settings?.silentRiskConfig?.weakSignalThreshold || 45}" style="width:100%;"></div>
        <div class="field" style="flex:1;"><label>Min Cluster Size</label><input type="number" id="minCluster" min="2" max="10" value="${state.settings?.silentRiskConfig?.minClusterSize || 3}"></div>

      <p style="font-size:12px;color:var(--chalk-faint);margin-top:10px;font-style:italic;">Detect weak signals grouped by confidence threshold</p>
    </div>
  </div>

}

/* ---- Onboarding (2-step wizard — each step short enough to need zero scrolling) ---- */

            <button type="button" class="mode-btn ${quick==='14'?'active':''}" data-date-quick="14">${t('date_2weeks')}</button>

function attachOnboardHandlers(){
  const textIds = ['ob_company','ob_type','ob_jobs','ob_size','ob_projname','ob_client','ob_address','ob_value','ob_pm'];
  state.onboardDraft = state.onboardDraft || {};
  // Autosave as the contractor types — reopening this screen later (or after an
  // accidental reload) restores exactly what was already entered, on whichever step.
  textIds.forEach(id=>{
    document.getElementById(id)?.addEventListener('input', (e)=>{
      state.onboardDraft[id] = e.target.value; saveState();
    });
  });
  document.getElementById('ob_next')?.addEventListener('click', ()=>{
    if(!document.getElementById('ob_company')?.value?.trim()){ alert(t('validate_company_required')); return; }
    state.onboardDraft.step = 2; saveState(); render();
  });
  document.getElementById('ob_back')?.addEventListener('click', ()=>{
    state.onboardDraft.step = 1; saveState(); render();
  });
  document.querySelectorAll('[data-date-quick]').forEach(b=>b.addEventListener('click', ()=>{
    const val = b.dataset.dateQuick;
    state.onboardDraft.ob_completion_quick = val;
    state.onboardDraft.ob_completion_showExact = false;
    if(val==='unsure'){ state.onboardDraft.ob_completion=''; }
    else { const dd = new Date(); dd.setDate(dd.getDate()+parseInt(val,10)); state.onboardDraft.ob_completion = dd.toISOString().slice(0,10); }
    saveState(); render();
  }));
  document.getElementById('pickExactToggle')?.addEventListener('click', ()=>{
    state.onboardDraft.ob_completion_showExact = true; saveState(); render();
  });
  document.getElementById('ob_completion_exact')?.addEventListener('change', (e)=>{
    state.onboardDraft.ob_completion = e.target.value; state.onboardDraft.ob_completion_quick = null; saveState();
  });
  document.getElementById('ob_submit')?.addEventListener('click', ()=>{
    const g = id=>document.getElementById(id)?.value?.trim();
    if(!g('ob_company') || !g('ob_projname')){ alert(t('validate_both_required')); return; }
    state.company = { name:g('ob_company'), contractorType:g('ob_type')||'General Contractor', activeJobs:g('ob_jobs')||'', avgSize:g('ob_size')||'' };
    state.projects.push({ id:uid('proj'), name:g('ob_projname'), client:g('ob_client')||'—', address:g('ob_address')||'—',
      contractValue:g('ob_value')||'—', start:'', completion:g('ob_completion')||'', pm:g('ob_pm')||'—', status:'ACTIVE', createdAt:Date.now() });
    state.onboarded = true;
    state.ui.tab = 'inbox';
    state.onboardDraft = {}; // clear the draft — the real record now lives in company/projects
    saveState(); render();
  });
  document.getElementById('ob_demo')?.addEventListener('click', ()=>{ loadDemoData(); render(); });
  document.getElementById('langSelect')?.addEventListener('change', (e)=>{
    state.ui.lang = e.target.value; saveState(); render();
  });
}

/* ---------------- event handlers ---------------- */
function attachGlobalHandlers(){
  document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click', ()=>{
    state.ui.tab = b.dataset.tab; render();
  }));
  document.getElementById('projSelector')?.addEventListener('change', (e)=>{
    state.ui.selectedProject = e.target.value; render();
  });
  document.getElementById('langSelect')?.addEventListener('change', (e)=>{
    state.ui.lang = e.target.value; saveState(); render();
  });
  document.querySelectorAll('[data-toggle-legal]').forEach(el=>el.addEventListener('click', ()=>{
    const key = el.dataset.toggleLegal;
    state.ui.aboutExpanded = state.ui.aboutExpanded || {};
    state.ui.aboutExpanded[key] = !state.ui.aboutExpanded[key];
    render();
  }));
  document.querySelectorAll('[data-open-project]').forEach(b=>b.addEventListener('click', ()=>{
    state.ui.selectedProject = b.dataset.openProject; state.ui.tab='project'; render();
  }));
  document.querySelectorAll('[data-goto-alert]').forEach(b=>b.addEventListener('click', ()=>{
    state.ui.alertDetail = b.dataset.gotoAlert; render();
  }));
  document.querySelectorAll('[data-open-alert]').forEach(b=>b.addEventListener('click', ()=>{
    state.ui.alertDetail = b.dataset.openAlert; render();
  }));
  document.getElementById('modalBg')?.addEventListener('click', (e)=>{ if(e.target.id==='modalBg'){ state.ui.alertDetail=null; render(); } });
  document.getElementById('closeModal')?.addEventListener('click', ()=>{ state.ui.alertDetail=null; render(); });
  document.querySelectorAll('[data-alert-status]').forEach(b=>b.addEventListener('click', ()=>{
    const [id,status] = b.dataset.alertStatus.split(':');
    const a = state.alerts.find(x=>x.id===id); if(a){ a.status = status; if(status==='RESOLVED') a.resolved_at=Date.now(); }
    saveState(); render();
  }));
  document.querySelectorAll('[data-add-action]').forEach(b=>b.addEventListener('click', ()=>{
    const alertId = b.dataset.addAction;
    const a = state.alerts.find(x=>x.id===alertId);
    if(a){ state.actions.unshift({ id:uid('act'), alertId, projectId:a.projectId, title:a.recommended_action, status:'OPEN', dueAt:null, createdAt:Date.now() }); a.status='ACKNOWLEDGED'; }
    saveState(); render();
  }));
  document.querySelectorAll('[data-record-outcome]').forEach(b=>b.addEventListener('click', ()=>{
    const alertId = b.dataset.recordOutcome;
    const type = document.getElementById('outcomeType').value;
    const amount = parseFloat(document.getElementById('outcomeAmount').value)||0;
    state.outcomes.push({ id:uid('out'), alertId, type, amount, verified:true, createdAt:Date.now() });
    const a = state.alerts.find(x=>x.id===alertId); if(a) a.status='RESOLVED';
    saveState(); render();
  }));

  /* Inbox */
  document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click', ()=>{
    state.ui.captureMode = b.dataset.mode; render();
  }));
  document.getElementById('submitCapture')?.addEventListener('click', handleSubmitCapture);
  document.getElementById('autoDetectProj')?.addEventListener('click', ()=>{
    const text = document.getElementById('captureText')?.value || '';
    const guess = guessProjectId(text);
    const note = document.getElementById('detectNote');
    if(guess.confident){
      document.getElementById('inputProject').value = guess.projectId;
      note.textContent = t('auto_detect_matched');
      note.style.color = 'var(--green)';
    } else {
      note.textContent = t('auto_detect_unclear');
      note.style.color = 'var(--amber)';
    }
  });

  document.getElementById('themeToggle')?.addEventListener('click', toggleTheme);
  document.getElementById('settingsThemeToggle')?.addEventListener('click', toggleTheme);

  /* Settings */
  document.getElementById('saveAssumptions')?.addEventListener('click', ()=>{
    const g = id=>parseFloat(document.getElementById(id).value)||0;
    state.assumptions = {
      laborRate: g('a_laborRate'), crewSize: g('a_crewSize'), dailyOverhead: g('a_dailyOverhead'),
      markup: g('a_markup')/100, materialMarkup: g('a_materialMarkup')/100
    };
    saveState(); render();
  });
  document.getElementById('currencySelect')?.addEventListener('change', (e)=>{
    state.settings = state.settings || {};
    state.settings.currency = e.target.value;
    saveState(); render();
  });
  document.getElementById('saveAiKey')?.addEventListener('click', ()=>{
    state.settings = state.settings || {};
    state.settings.apiKey = document.getElementById('apiKeyInput')?.value.trim() || '';
    saveState();
    const ok = document.getElementById('aiKeySaved');
    if(ok){ ok.textContent = t('settings_saved'); setTimeout(()=>{ ok.textContent=''; }, 2500); }
  });
  document.getElementById('saveFeedback')?.addEventListener('click', ()=>{
    const body = document.getElementById('feedbackText')?.value || '';
    window.location.href = 'mailto:support@foresiteapp.com?subject=' + encodeURIComponent('Foresite feedback') + '&body=' + encodeURIComponent(body);
  });
  document.getElementById('resetAll')?.addEventListener('click', ()=>{
    if(confirm(t('reset_confirm'))){
      state = freshState(); saveState(); render();
    }
  });

  /* Ask My Jobs */
  document.getElementById('askSubmit')?.addEventListener('click', handleAsk);
  document.getElementById('askInput')?.addEventListener('keydown', (e)=>{ if(e.key==='Enter') handleAsk(); });
  document.querySelectorAll('[data-suggest]').forEach(b=>b.addEventListener('click', ()=>{
    document.getElementById('askInput').value = b.dataset.suggest; handleAsk();
  }));

  /* Free scan */
  document.getElementById('runScan')?.addEventListener('click', handleRunScan);
  document.getElementById('convertScan')?.addEventListener('click', ()=>{
    const s = state.scan;
    const proj = { id:uid('proj'), name:'New Scanned Project', client:'—', address:'—', contractValue:'—', start:'', completion:'', pm:'—', status:'ACTIVE', createdAt:Date.now() };
    if(!state.onboarded){
      state.company = { name:'My Construction Co.', contractorType:'General Contractor', activeJobs:'1', avgSize:'' };
      state.onboarded = true;
    }
    state.projects.push(proj);
    s.events.forEach(e=>{ e.projectId = proj.id; state.events.unshift(e); });
    s.exposures.forEach(e=>{ e.projectId = proj.id; state.exposures.unshift(e); });
    s.events.forEach(e=>{
      const exp = state.exposures.find(x=>x.eventId===e.id);
      const al = maybeCreateAlert(e, exp);
      if(al) state.alerts.unshift(al);
    });
    state.scan = null; state.ui.tab='portfolio'; state.ui.selectedProject='all';
    saveState(); render();
  });
  document.getElementById('newScan')?.addEventListener('click', ()=>{ state.scan=null; render(); });
}

async function handleSubmitCapture(){
  const mode = state.ui.captureMode;
  const btn = document.getElementById('submitCapture');
  const statusEl = document.getElementById('captureStatus');
  const projSelect = document.getElementById('inputProject');
  const projectId = projSelect ? projSelect.value : (state.projects[0]?.id);
  if(!projectId){
    statusEl.innerHTML = state.projects.length===0
      ? `<div class="empty">${t('inbox_add_project_first')}</div>`
      : `<div class="empty">${t('inbox_which_project')}</div>`;
    return;
  }

  btn.disabled = true;
  statusEl.innerHTML = `<div class="processing"><span class="spinner"></span>${t('processing_dots')}</div>`;

  try{
    if(mode==='voice' || mode==='text'){
      const text = document.getElementById('captureText').value.trim();
      if(!text){ statusEl.innerHTML=''; btn.disabled=false; return; }
      const ri = { id:uid('ri'), projectId, type:mode, content:text, capturedAt:Date.now(), processing_status:'processing' };
      await processRawInput(ri);
    } else {
      const file = document.getElementById('captureFile').files[0];
      if(!file){ statusEl.innerHTML=''; btn.disabled=false; return; }
      const base64 = await fileToBase64(file);
      const ri = { id:uid('ri'), projectId, type:mode, fileName:file.name, mediaType:file.type||(mode==='pdf'?'application/pdf':'image/jpeg'),
        base64, caption: mode==='photo' ? document.getElementById('captureCaption')?.value : '', capturedAt:Date.now(), processing_status:'processing' };
      await processRawInput(ri);
    }
  }catch(e){
    console.error(e);
  }
  render();
}

function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(r.result.split(',')[1]);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

async function handleAsk(){
  const input = document.getElementById('askInput');
  const q = input.value.trim();
  if(!q) return;
  input.value='';
  state.ui.askHistory.push({role:'user', text:q});
  state.ui.askHistory.push({role:'ai', text:'', pending:true});
  render();
  try{
    const answer = await askMyJobs(q);
    const last = state.ui.askHistory[state.ui.askHistory.length-1];
    last.text = answer; last.pending = false;
  }catch(e){
    const last = state.ui.askHistory[state.ui.askHistory.length-1];
    last.text = (e && e.message==='NO_API_KEY') ? t('ai_key_missing') : t('ask_error'); last.pending=false;
  }
  saveState(); render();
}

async function handleRunScan(){
  const text = document.getElementById('scanText').value.trim();
  const statusEl = document.getElementById('scanStatus');
  if(!text) return;
  statusEl.innerHTML = `<div class="processing"><span class="spinner"></span>${t('scan_processing')}</div>`;
  try{
    const rawEvents = await extractFromInput({type:'text', content:text});
    const events = [], exposures = [];
    rawEvents.forEach(raw=>{
      if(!ALL_EVENT_TYPES.includes(raw.type)) return;
      const rf = raw.risk_factors||{probability:40,impact:40,urgency:40};
      const sev = computeSeverity(rf.probability??40, rf.impact??40, rf.urgency??40);
      const evt = { id:uid('evt'), projectId:'scan', sourceId:null, type:raw.type, title:raw.title||raw.type,
        description:raw.description||'', confidence:raw.confidence??0.5, fact:raw.fact||null, signal:raw.signal||null,
        inference:raw.inference||null, recommendation:raw.recommendation||null, entities:raw.entities||[],
        financial_signals:raw.financial_signals||{}, risk_factors:rf, severity_score:sev.score, severity_band:sev.band, occurredAt:Date.now() };
      events.push(evt);
      exposures.push(computeExposure(evt, state.assumptions));
    });
    state.scan = { events, exposures };
  }catch(e){
    console.error(e);
    statusEl.innerHTML = `<div class="empty">${(e && e.message==='NO_API_KEY') ? t('ai_key_missing') : t('scan_error')}</div>`;
    return;
  }
  render();
}

/* ---------------- init ---------------- */
function markNextTouch(){
  const root = document.querySelector('.content') || document.getElementById('app');
  const btn = root ? root.querySelector('.btn-primary:not(.next-touch)') : null;
  if(btn) btn.classList.add('next-touch');
}
function registerServiceWorker(){
  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
  }
}
loadState();
registerServiceWorker();
markNextTouch();
